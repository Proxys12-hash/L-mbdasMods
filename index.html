<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatrickVRPC | Lambda Mod Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --neon-red: #ff0000;
            --neon-glow: rgba(255, 0, 0, 0.8);
            --bg-dark: #000000;
            --panel: rgba(10, 10, 10, 0.98);
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-dark); 
            color: #fff; 
            overflow-x: hidden;
        }

        /* Background Effects */
        .cyber-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1; pointer-events: none;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }

        .container { position: relative; z-index: 10; max-width: 900px; margin: 0 auto; padding: 40px 20px; text-align: center; }

        /* Neon Header with Flicker */
        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; text-shadow: 0 0 20px var(--neon-red); }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.4; text-shadow: none; }
        }

        h1 { 
            font-size: 5rem; color: #fff; 
            margin: 10px 0; letter-spacing: -2px; 
            animation: flicker 4s infinite;
        }

        .dev-tag { color: var(--neon-red); font-weight: 900; letter-spacing: 5px; text-transform: uppercase; font-size: 14px; }

        .stats-bar {
            display: flex; justify-content: center; gap: 20px; margin: 20px 0;
            font-family: monospace; font-size: 14px;
        }
        .live-stat { background: #111; border: 1px solid #333; padding: 5px 15px; border-radius: 4px; }

        /* Vibrant Heartbeat Buttons */
        @keyframes heartbeat {
            0% { transform: scale(1); box-shadow: 0 0 5px var(--neon-red); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px var(--neon-red); }
            100% { transform: scale(1); box-shadow: 0 0 5px var(--neon-red); }
        }
        
        .btn-wrap { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin: 40px 0; }
        .btn { 
            padding: 20px; font-size: 1rem; font-weight: 900; 
            text-decoration: none; border-radius: 8px; color: white;
            text-transform: uppercase; border: 2px solid var(--neon-red); 
            background: rgba(255, 0, 0, 0.15); cursor: pointer; transition: 0.2s;
            animation: heartbeat 2.5s infinite;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        }
        .btn i { font-size: 1.5rem; }
        .btn:hover { background: var(--neon-red); color: black; transform: translateY(-5px); }

        /* Mod Menu Simulator */
        .menu-frame { 
            background: var(--panel); border: 2px solid #333; 
            border-radius: 12px; padding: 20px; 
            box-shadow: 0 0 40px rgba(255,0,0,0.2);
        }
        .screen { 
            background: #050505; border: 1px solid #222; height: 480px; 
            border-radius: 4px; overflow-y: auto; padding: 15px; text-align: left;
        }
        .mod-btn { 
            background: #111; border: 1px solid #222; color: #eee;
            padding: 12px; margin-bottom: 6px; border-radius: 4px; 
            cursor: pointer; display: flex; justify-content: space-between;
            font-weight: bold; font-size: 13px; transition: 0.1s;
        }
        .mod-btn:hover { border-color: var(--neon-red); background: #1a1a1a; }
        .back-btn { color: var(--neon-red) !important; border-color: var(--neon-red) !important; font-style: italic; }
        .header-btn { color: #555 !important; border: none; background: transparent; cursor: default; font-size: 11px; text-transform: uppercase; }

        .music-ctrl { position: fixed; bottom: 20px; left: 20px; z-index: 100; background: #000; border: 2px solid var(--neon-red); padding: 12px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

            ],
            "Vis": [
                { t: "Exit Visuals", next: "Main", back: true },
                { t: "Mod Tags", type: "mod" }
            ]
        };

        function render(page) {
            const display = document.getElementById('menuDisplay');
            display.innerHTML = "";
            menuData[page].forEach(item => {
                const d = document.createElement('div');
                d.className = "mod-btn";
                if(item.back) d.className += " back-btn";
                if(item.type === "header") d.className = "mod-btn header-btn";
                
                d.innerHTML = `<span>${item.t}</span> <span>${item.next && !item.back ? '→' : ''}</span>`;
                if(item.next) d.onclick = () => render(item.next);
                display.appendChild(d);
            });
            display.scrollTop = 0;
        }

        const player = document.getElementById('player');
        function toggleMusic() {
            if(player.paused) { player.play(); document.getElementById('mBtn').innerText = "🔊 LO-FI: ON"; }
            else { player.pause(); document.getElementById('mBtn').innerText = "🔈 LO-FI: OFF"; }
        }

        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let flakes = [];
        function init() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; flakes = []; for(let i=0; i<70; i++) flakes.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*3+1}); }
        function draw() { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); flakes.forEach(f => { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); f.y += f.r/2 + 0.5; if(f.y > canvas.height) f.y = -5; }); ctx.fill(); requestAnimationFrame(draw); }
        window.onresize = init; init(); draw(); render('Main');
    </script>
</body>
</html>
